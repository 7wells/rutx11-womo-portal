name: Private data check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-privacy-check:
    uses: 7wells/repo-privacy-check/.github/workflows/privacy-check.yml@daef1143e8bc25ea04f5ab5f46b0e769a4288c8d # v0.3.2 full-scan workflow

  private-data-check:
    needs: generic-privacy-check
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for private GPS/runtime data
        run: sh scripts/check_no_private_data.sh
